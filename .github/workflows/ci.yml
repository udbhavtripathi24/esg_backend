name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: esg
          POSTGRES_PASSWORD: esg
          POSTGRES_DB: esg_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esg -d esg_platform"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://esg:esg@localhost:5432/esg_platform
      SECRET_KEY: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # pinned: SQLModel/Pydantic not yet 3.13/3.14-ready
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: pytest
