services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: esg
      POSTGRES_PASSWORD: esg
      POSTGRES_DB: esg_platform
    ports:
      - "5432:5432"
    volumes:
      - esg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esg -d esg_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://esg:esg@db:5432/esg_platform
      ENVIRONMENT: development
      SECRET_KEY: dev-secret-change-this-in-production
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  esg_pgdata:
